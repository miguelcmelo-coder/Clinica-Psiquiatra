<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Clínica Psiquiátrica</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2efeb;
            color: #292631;
            min-height: 100vh;
        }

        .logo {
            width: 280px;
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        header {
            padding: 25px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: #51469a;
            font-family: Georgia, serif;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar {
            color: #51469a;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        main {
            padding: 35px 20px 60px;
        }

        .cadastro-container {
            max-width: 650px;
            margin: auto;
            padding: 38px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(40, 30, 70, 0.08);
        }

        .subtitulo {
            color: #51469a;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
        }

        h1 {
            color: #51469a;
            font-family: Georgia, serif;
            font-size: 34px;
            text-align: center;
            margin: 12px 0;
        }

        .descricao {
            text-align: center;
            color: #686471;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo.completo {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #40377f;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9d4e3;
            border-radius: 6px;
            background: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #51469a;
            box-shadow: 0 0 0 3px rgba(81, 70, 154, 0.12);
        }

        .termos {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 23px 0;
            font-size: 12px;
            line-height: 1.6;
        }

        .termos input {
            width: auto;
            margin-top: 4px;
        }

        .termos label {
            font-weight: normal;
            color: #686471;
        }

        .termos a {
            color: #51469a;
        }

        .botao {
            width: 100%;
            padding: 15px;
            background: #51469a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao:hover {
            background: #40377f;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 13px;
            background: #f0edf9;
            color: #40377f;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }

        .mensagem.erro {
            background: #fcebea;
            color: #b3261e;
            border-left: 4px solid #b3261e;
        }

        .mensagem.sucesso {
            background: #e8f5ec;
            color: #1e6b3a;
            border-left: 4px solid #1e6b3a;
        }

        input[aria-invalid="true"] {
            border-color: #b3261e;
        }

        .botao:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #686471;
        }

        .login a {
            color: #51469a;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: #51469a;
            color: white;
            font-family: Georgia, serif;
            font-size: 13px;
        }

        @media (max-width: 550px) {
            header {
                justify-content: center;
                text-align: center;
            }

            .cadastro-container {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo.completo {
                grid-column: auto;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="../index.html" aria-label="Ir para a página inicial"><img src="../static/img/logo.png" alt="Clínica Psiquiátrica" class="logo"></a>

        <a href="../index.html" class="voltar">
            ← VOLTAR AO INÍCIO
        </a>
    </header>

    <main>
        <section class="cadastro-container">

            <p class="subtitulo">CRIE SUA CONTA</p>

            <h1>Faça seu cadastro</h1>

            <p class="descricao">
                Preencha seus dados para criar seu cadastro
                e facilitar o contato com a clínica.
            </p>

            <form id="formCadastro" novalidate>

                <div class="form-grid">

                    <div class="campo completo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" autocomplete="name"
                            placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14"
                            placeholder="000.000.000-00" required>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" autocomplete="bday" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 99999-9999"
                            required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" autocomplete="email"
                            placeholder="seuemail@exemplo.com" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8"
                            placeholder="Mínimo de 8 caracteres, com letras e números" required>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">
                            Confirmar senha
                        </label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password"
                            minlength="8" placeholder="Repita sua senha" required>
                    </div>

                </div>

                <div class="termos">
                    <input type="checkbox" id="aceite" name="aceite" required>

                    <label for="aceite">
                        Li e concordo com a
                        <a href="privacidade.html">
                            política de privacidade
                        </a>
                        e com o tratamento dos meus dados
                        conforme as informações apresentadas.
                    </label>
                </div>

                <button type="submit" class="botao">
                    CRIAR CADASTRO
                </button>

                <div class="mensagem" id="mensagem" role="status" aria-live="polite"></div>

            </form>

            <p class="login">
                Já tem cadastro? <a href="login.html">Entrar</a>
            </p>

        </section>
    </main>

    <footer>
        Clínica Psiquiátrica — Barra Funda
        <br>
        Atendimento com acolhimento e responsabilidade
    </footer>

    <script src="../static/js/auth.js"></script>
    <script src="../static/js/formulario.js"></script>

</body>

</html>
