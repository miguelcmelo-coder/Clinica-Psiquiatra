<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Nova senha</title><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"></head><body class="auth-page"><header class="auth-header"><a href="{{ url_for('inicio') }}"><img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Clínica Psiquiátrica"></a><a href="{{ url_for('login.login') }}" class="link-topo">← VOLTAR AO LOGIN</a></header><main class="auth-main"><section class="auth-card" style="display:block;max-width:560px"><div class="auth-form-wrap"><p class="subtitulo">ÁREA DO PACIENTE</p><h1>Crie uma nova senha</h1>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,texto in mensagens %}<div class="alerta {{ categoria }}">{{ texto }}</div>{% endfor %}{% endwith %}<p class="descricao">Sua nova senha deve ter pelo menos 8 caracteres.</p><form method="post"><div class="campo"><label for="senha">Nova senha</label><input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required></div><div class="campo"><label for="confirmar">Confirmar senha</label><input type="password" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required></div><button class="botao" type="submit">SALVAR NOVA SENHA</button></form></div></section></main><footer class="auth-footer">Clínica Psiquiátrica — Barra Funda</footer></body></html>
