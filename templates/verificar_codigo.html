<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Verificar código</title><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"></head><body class="auth-page"><header class="auth-header"><a href="{{ url_for('inicio') }}"><img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Clínica Psiquiátrica"></a><a href="{{ url_for('login.login') }}" class="link-topo">← VOLTAR AO LOGIN</a></header><main class="auth-main"><section class="auth-card" style="display:block;max-width:560px"><div class="auth-form-wrap"><p class="subtitulo">ÁREA DO PACIENTE</p><h1>Código de recuperação</h1>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,texto in mensagens %}<div class="alerta {{ categoria }}">{{ texto }}</div>{% endfor %}{% endwith %}<p class="descricao">Digite o código de 6 dígitos enviado para <strong>{{ email }}</strong>.</p><form method="post"><div class="campo"><label for="codigo">Código</label><input type="text" id="codigo" name="codigo" maxlength="6" minlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></div><button class="botao" type="submit">VERIFICAR CÓDIGO</button></form><form method="post" action="{{ url_for('recuperacao.reenviar_codigo') }}"><button class="link-btn" type="submit">Reenviar código</button></form></div></section></main><footer class="auth-footer">Clínica Psiquiátrica — Barra Funda</footer></body></html>
